<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<title>ZERO HOUR — Outbreak Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800;900&display=swap" media="print" onload="this.media='all'">
<style>
/* ============ ZERO HOUR — STYLES ============ */
:root{
  --bg:#04070d; --panel:rgba(9,15,27,.86); --panel2:rgba(14,22,38,.92); --line:rgba(130,170,230,.18); --line2:rgba(130,170,230,.32);
  --text:#e3ecf8; --dim:#8a9db8; --faint:#5b6c86;
  --red:#ff3b3b; --red2:#ff6a4d; --cyan:#35d6c4; --amber:#ffb02e; --violet:#b07cff; --green:#59d36a; --blue:#5aa0ff;
  --font:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif; --mono:'Orbitron','Rajdhani',ui-monospace,monospace;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:var(--font);font-size:16px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:inherit}
b{font-weight:700}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:#02050a}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#fx-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);z-index:2}
#fx-scan{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.35;background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
#fx-red{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,30,30,.0) 100%);transition:background 2s}
#fx-glitch{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,40,80,.18) 0 2px,transparent 2px 6px);mix-blend-mode:screen}
#fx-glitch.on{animation:glitch .6s steps(6) 1}
@keyframes glitch{0%{opacity:.9;transform:translateX(-8px)}25%{opacity:.5;transform:translateX(6px)}50%{opacity:.8;transform:translateX(-3px)}100%{opacity:0;transform:none}}

/* ---------- generic glass ---------- */
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.45);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(180deg,#ff4a3d,#c4161c);border-color:#ff7a6b;box-shadow:0 0 24px rgba(255,50,50,.35);color:#fff}
.btn.primary:hover{box-shadow:0 0 34px rgba(255,60,60,.6);filter:brightness(1.1)}
.btn.cyan{border-color:rgba(53,214,196,.6);color:var(--cyan)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.kbd{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--dim)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(130,170,230,.25);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;height:64px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,rgba(2,5,10,.92),rgba(2,5,10,0));pointer-events:none}
#topbar>*{pointer-events:auto}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.pname{display:flex;flex-direction:column;line-height:1.05}
.pname b{font-size:18px;letter-spacing:.07em;text-transform:uppercase}
.pname small{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.pdot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 12px currentColor;background:currentColor}
.datebox{display:flex;flex-direction:column;line-height:1.05;min-width:76px}
.datebox span{font-family:var(--mono);font-size:15px;letter-spacing:.03em}
.datebox small{font-size:11px;color:var(--dim);letter-spacing:.14em}
.speed{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.speed button{width:38px;height:32px;border-radius:7px;font-size:13px;color:var(--dim);font-weight:700}
.speed button:hover{background:rgba(255,255,255,.08);color:#fff}
.speed button.on{background:rgba(255,70,60,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,90,80,.6)}
.ep{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 10px;border-radius:10px;background:linear-gradient(180deg,rgba(53,214,196,.14),rgba(53,214,196,.04));border:1px solid rgba(53,214,196,.45);cursor:pointer}
.ep svg{width:26px;height:26px;color:var(--cyan);filter:drop-shadow(0 0 6px rgba(53,214,196,.7))}
.ep b{font-family:var(--mono);font-size:21px;color:#c8fff7;min-width:34px;text-align:right}
.ep small{display:block;font-size:10px;letter-spacing:.16em;color:var(--cyan);margin-top:-2px}
.ep.pulse{animation:epPulse .5s ease}
@keyframes epPulse{50%{transform:scale(1.08);box-shadow:0 0 28px rgba(53,214,196,.7)}}
.iconbtn{width:42px;height:42px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.iconbtn.on{border-color:rgba(53,214,196,.6);color:var(--cyan)}

/* world panel */
#world{position:absolute;top:74px;left:14px;width:276px;padding:14px 16px}
.w-title{font-size:12px;letter-spacing:.22em;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.w-title button{font-size:15px;color:var(--dim)}
.w-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.w-num{padding:6px 2px;border-radius:8px;background:rgba(255,255,255,.03)}
.w-num small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.w-num b{font-family:var(--mono);font-size:15px}
.w-num.h b{color:#ffe2b0}.w-num.i b{color:var(--red2)}.w-num.d b{color:#9a8fb8}
.w-bar{height:8px;border-radius:5px;margin:10px 0 8px;overflow:hidden;display:flex;background:rgba(255,255,255,.07)}
.w-bar i{display:block;height:100%;transition:width .5s}
.w-bar .bh{background:#ffd9a0}.w-bar .bi{background:linear-gradient(90deg,#ff3b3b,#ff7a4d)}.w-bar .bd{background:#3a3348}.w-bar .bc{background:var(--cyan)}
.w-info{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:10px}
.w-info b{color:var(--text)}
.meter{margin-top:9px}
.meter .mh{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.meter .mh b{color:var(--text);font-family:var(--mono);font-size:12px}
.meter .mb{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.meter .mb i{display:block;height:100%;border-radius:5px;transition:width .5s}
#m-cure .mb i{background:linear-gradient(90deg,#2f89ff,#35d6c4);box-shadow:0 0 12px rgba(53,214,196,.6)}
#m-aw .mb i{background:linear-gradient(90deg,#ffb02e,#ff4b3b);box-shadow:0 0 12px rgba(255,120,40,.5)}
.w-actions{display:flex;gap:8px;margin-top:12px}
.w-actions .btn{flex:1;padding:8px 6px;font-size:12px}

/* country panel */
#cpanel{position:absolute;top:74px;right:14px;bottom:84px;width:384px;display:flex;flex-direction:column;overflow:hidden;animation:slideR .25s ease}
@keyframes slideR{from{transform:translateX(30px);opacity:0}}
.cp-scroll{overflow-y:auto;flex:1}
.cp-hero{position:relative;height:178px;background-size:cover;background-position:center;background-color:#101826;flex:none}
.cp-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,14,.25) 0%,rgba(4,8,14,.35) 40%,rgba(8,13,24,.96) 100%)}
.cp-hero .cp-x{position:absolute;right:10px;top:10px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line2);font-size:16px}
.cp-hero .cp-nm{position:absolute;left:16px;bottom:10px;right:16px;z-index:2}
.cp-hero h2{font-size:25px;text-shadow:0 2px 12px #000;line-height:1.05}
.cp-hero .cp-sub{font-size:13px;color:#c9d6ea;letter-spacing:.06em;text-shadow:0 1px 6px #000}
.cp-credit{position:absolute;right:10px;bottom:3px;z-index:3;font-size:9.5px;color:rgba(255,255,255,.5);max-width:60%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.cp-strip{display:flex;gap:6px;padding:8px 14px 2px;overflow-x:auto;flex:none}
.cp-strip .th{flex:none;width:72px;height:48px;border-radius:7px;background-size:cover;background-position:center;border:1px solid var(--line);cursor:pointer;opacity:.72;transition:.15s;background-color:#0c1422}
.cp-strip .th:hover,.cp-strip .th.on{opacity:1;border-color:#fff}
.cp-body{padding:10px 16px 16px}
.cp-big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.cp-big div{padding:7px 4px;border-radius:8px;background:rgba(255,255,255,.04);text-align:center}
.cp-big small{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.cp-big b{font-family:var(--mono);font-size:14px}
.cp-sec{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.cp-sec:after{content:'';flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line2);color:var(--dim);background:rgba(255,255,255,.03)}
.chip2.on-red{color:#ffb3a8;border-color:rgba(255,90,70,.6);background:rgba(255,60,50,.12)}
.chip2.on-cyan{color:#9ff2e8;border-color:rgba(53,214,196,.6);background:rgba(53,214,196,.1)}
.chip2.on-amber{color:#ffd98c;border-color:rgba(255,176,46,.6);background:rgba(255,176,46,.1)}
.chip2.on-violet{color:#d9c2ff;border-color:rgba(176,124,255,.6);background:rgba(176,124,255,.12)}
.chip2.off{opacity:.4}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.rate div{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--dim)}
.pips{display:flex;gap:3px}.pips i{width:12px;height:6px;border-radius:2px;background:rgba(255,255,255,.12)}.pips i.on{background:var(--cyan);box-shadow:0 0 6px rgba(53,214,196,.6)}
.cp-meter{margin:6px 0}
.cp-cities{display:flex;flex-direction:column;gap:8px}
.cityc{display:flex;gap:10px;padding:6px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);cursor:pointer;transition:.15s;align-items:center}
.cityc:hover{background:rgba(255,255,255,.08);border-color:var(--line2)}
.cityc .ph{flex:none;width:86px;height:58px;border-radius:7px;background-size:cover;background-position:center;background-color:#0b1320}
.cityc b{font-size:15px;letter-spacing:.04em}
.cityc small{display:block;color:var(--dim);font-size:12px}
.cityc .st{font-size:12px;color:var(--red2)}
.cp-about{font-size:13.5px;line-height:1.45;color:#b8c8e0}
.cp-about small{display:block;margin-top:6px;color:var(--faint);font-size:10.5px}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* bottom bar */
#bottombar{position:absolute;left:14px;right:14px;bottom:14px;height:56px;display:flex;gap:10px;align-items:stretch}
.evolve{flex:none;width:210px;border-radius:12px;font-family:var(--mono);font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#1c3b3f,#0b2024);border:1px solid rgba(53,214,196,.7);color:#bffcf3;position:relative;transition:.15s;box-shadow:0 0 22px rgba(53,214,196,.25)}
.evolve:hover{box-shadow:0 0 34px rgba(53,214,196,.55);filter:brightness(1.15)}
.evolve svg{width:26px;height:26px}
.evolve .badge{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:800;border:2px solid #04070d;animation:bdg 1.4s infinite}
@keyframes bdg{50%{transform:scale(1.15)}}
#ticker{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer;overflow:hidden}
.tk-tag{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#04070d;background:var(--red2);padding:4px 8px;border-radius:5px;font-weight:800}
.tk-tag.alert{background:var(--amber)}.tk-tag.mut{background:var(--violet)}.tk-tag.combo{background:var(--cyan)}
.tk-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;letter-spacing:.02em;animation:tk .5s ease}
@keyframes tk{from{opacity:0;transform:translateY(8px)}}
.bb-right{flex:none;display:flex;gap:6px;align-items:center}
.bb-right .iconbtn{width:46px;height:56px;border-radius:12px}

/* toasts / floaters / caption */
#toasts{position:absolute;top:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:20;width:min(560px,92vw)}
.toast{pointer-events:auto;padding:10px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:15px;display:flex;gap:10px;align-items:center;animation:toastIn .35s ease;max-width:100%}
.toast b{letter-spacing:.06em;text-transform:uppercase}
.toast.red{border-color:rgba(255,80,70,.6)}.toast.amber{border-color:rgba(255,176,46,.6)}.toast.cyan{border-color:rgba(53,214,196,.6)}.toast.violet{border-color:rgba(176,124,255,.65)}
.toast .ti{font-size:20px}
.toast.out{animation:toastOut .4s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
#floaters{position:absolute;inset:0;pointer-events:none;z-index:30}
.floater{position:absolute;font-family:var(--mono);font-weight:800;font-size:17px;color:#bffcf3;text-shadow:0 0 12px rgba(53,214,196,.9),0 2px 4px #000;animation:floatUp 1.3s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;max-width:min(760px,92vw);z-index:25;padding:10px 18px 10px 14px;border-radius:12px;background:rgba(6,10,18,.92);border:1px solid rgba(255,176,46,.55);display:flex;gap:12px;align-items:center;box-shadow:0 8px 34px rgba(0,0,0,.6);animation:toastIn .3s}
#caption .cap-l{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#1a1000;background:var(--amber);padding:4px 7px;border-radius:5px;font-weight:800;line-height:1.2;text-align:center}
#caption .cap-t{font-size:15px;line-height:1.35}
#caption .cap-t small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
#caption button{font-size:12px;color:var(--dim);border:1px solid var(--line2);border-radius:7px;padding:3px 8px}

/* map bubbles */
#bubbles{position:absolute;inset:0;pointer-events:none;z-index:8}
.bub{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;animation:bubIn .35s cubic-bezier(.3,1.6,.5,1),bob 2.6s ease-in-out infinite;transition:opacity .3s}
.bub:before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),rgba(255,255,255,.08) 45%,transparent 70%),radial-gradient(circle,var(--bc) 0%,transparent 72%);border:2px solid var(--bc);box-shadow:0 0 18px var(--bc),inset 0 0 12px var(--bc)}
.bub span{position:relative;filter:drop-shadow(0 1px 3px #000)}
.bub.dna{--bc:#35d6c4}.bub.disrupt{--bc:#4a9bff}.bub.spread{--bc:#ff4b3b}.bub.calm{--bc:#b07cff}
.bub.old{animation:bubIn .3s,blink .5s linear infinite}
@keyframes bubIn{from{transform:scale(0)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes blink{50%{opacity:.35}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column}
.screen.dim{background:rgba(2,4,9,.78);backdrop-filter:blur(5px)}
.screen.solid{background:radial-gradient(ellipse at 30% 0%,#0f1d33 0%,#05080f 60%)}
.scr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);flex:none}
.scr-head h2{font-size:20px;letter-spacing:.2em}
.xbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);font-size:17px;background:rgba(255,255,255,.04)}
.xbtn:hover{background:rgba(255,255,255,.14)}
.fadein{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}}

/* title */
#scr-title{align-items:flex-start;justify-content:center;background:linear-gradient(90deg,rgba(2,4,9,.92) 0%,rgba(2,4,9,.55) 42%,rgba(2,4,9,0) 75%)}
.t-wrap{padding:0 7vw;max-width:720px}
.t-logo{font-family:var(--mono);font-weight:900;font-size:clamp(44px,8vw,92px);line-height:.92;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(180deg,#fff 0%,#ffb0a5 45%,#ff3b3b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,50,50,.45))}
.t-sub{font-size:clamp(14px,1.6vw,19px);letter-spacing:.42em;text-transform:uppercase;color:var(--dim);margin:14px 0 32px}
.t-menu{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
.t-menu .btn{justify-content:flex-start;padding:14px 20px;font-size:16px}
.t-foot{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--faint)}
.t-ticker{position:absolute;bottom:44px;left:7vw;right:7vw;font-size:14px;color:#9fb0c8;letter-spacing:.04em;min-height:20px}

/* new game */
.ng-body{flex:1;overflow-y:auto;padding:22px}
.ng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1380px;margin:0 auto}
.pcard{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);border-color:var(--line2)}
.pcard.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 40px -6px var(--pc)}

/* ---------- evolve ---------- */
#scr-evolve{background:radial-gradient(ellipse at 70% -10%,#10223a 0%,#060a12 55%);}
.ev-top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}

.ev-tools input[type=search]{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;color:#fff;font-size:14px;width:200px;outline:0}
.ev-tools label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center;cursor:pointer}
.node{position:absolute;width:168px;height:52px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(14,22,38,.95);display:flex;align-items:center;gap:9px;padding:0 10px;cursor:pointer;transition:.15s;font-size:13.5px;font-weight:700;letter-spacing:.02em;line-height:1.1}

.node.locked{opacity:.38;filter:saturate(.3)}

.node.can{border-color:var(--bc);box-shadow:0 0 18px -4px var(--bc);background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 18%,#0e1626),#0e1626)}
.node.can .cs{color:#fff}
.node.own{background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 55%,#10182a),color-mix(in srgb,var(--bc) 25%,#0a101c));border-color:var(--bc);color:#fff}

.sidehead{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin:14px 0 8px}

.stat{margin:6px 0}

.fx.pos{color:#9ff2c4;border-color:rgba(89,211,106,.4)}.fx.neg{color:#ffb3a8;border-color:rgba(255,90,70,.4)}

.ev-actions{display:flex;gap:10px;flex-direction:column;align-items:stretch;width:210px}

/* modal */
#modal{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(1,3,8,.62);backdrop-filter:blur(3px);animation:fadeIn .25s}
.mbox{width:min(520px,92vw);border-radius:18px;background:linear-gradient(180deg,#141f33,#0a1120);border:1px solid var(--line2);box-shadow:0 20px 80px rgba(0,0,0,.7);overflow:hidden;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}

/* generic list panels (stats / countries / news / settings) */
.panel-wrap{margin:auto;width:min(1080px,96vw);max-height:92vh;display:flex;flex-direction:column;border-radius:18px;background:linear-gradient(180deg,#101a2c,#080d17);border:1px solid var(--line2);box-shadow:0 20px 90px rgba(0,0,0,.75);overflow:hidden;animation:pop .3s}

.tbl th:first-child,.tbl td:first-child{text-align:left}

.tbl tr:hover td{background:rgba(255,255,255,.05);cursor:pointer}
.bar-mini{display:inline-block;width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);vertical-align:middle;margin-left:8px;overflow:hidden}.bar-mini i{display:block;height:100%}
.pbadge{display:inline-block;margin-left:4px;font-size:12px}
.news-item{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(130,170,230,.08);font-size:15px;line-height:1.35}
.news-item .nd{flex:none;width:58px;font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:3px}
.news-item.alert{color:#ffd98c}.news-item.mutation{color:#d9c2ff}.news-item.combo{color:#9ff2e8}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid rgba(130,170,230,.1)}
.setrow label{font-size:15px;letter-spacing:.05em}.setrow small{display:block;color:var(--dim);font-size:12px;margin-top:2px;letter-spacing:0}
.setrow input[type=range]{width:200px;accent-color:#ff5a4d}
.tog{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;transition:.2s;flex:none;border:1px solid var(--line2)}
.tog:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:rgba(53,214,196,.5);border-color:var(--cyan)}.tog.on:after{left:22px}
.seg{display:flex;gap:4px;padding:3px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}.seg button.on{background:rgba(255,90,80,.28);color:#fff}
.credits p{margin:0 0 12px;color:#b8c8e0;font-size:14.5px;line-height:1.45}

.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--dim)}.tabs button.on{background:rgba(255,255,255,.1);color:#fff;border-color:var(--line2)}
.chartbox{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);padding:10px;margin-bottom:14px}

.legend{display:flex;gap:16px;font-size:13px;color:var(--dim);margin:6px 4px 0;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}

/* end screen */
#scr-end{align-items:center;justify-content:center;overflow:auto;padding:20px}
.end-card{width:min(900px,96vw);border-radius:22px;background:linear-gradient(180deg,rgba(16,26,44,.97),rgba(6,10,18,.98));border:1px solid var(--line2);padding:26px 30px;box-shadow:0 30px 120px rgba(0,0,0,.8);animation:pop .5s}

.end-card.win h1{color:#ff5a4d;text-shadow:0 0 40px rgba(255,60,50,.5)}.end-card.lose h1{color:#35d6c4;text-shadow:0 0 40px rgba(53,214,196,.4)}

.score{font-family:var(--mono);font-size:30px}.score small{display:block;font-family:var(--font);font-size:11px;letter-spacing:.2em;color:var(--dim)}
.rankline{display:flex;gap:24px;align-items:center;margin:0 0 14px;flex-wrap:wrap}

/* loader */

#loader .lb{width:240px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}#loader .lb i{display:block;height:100%;width:30%;background:#ff5a4d;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

/* tips */
#tip{position:absolute;z-index:22;left:50%;transform:translateX(-50%);bottom:152px;max-width:min(520px,92vw);padding:12px 16px;border-radius:12px;background:rgba(10,30,34,.95);border:1px solid rgba(53,214,196,.6);font-size:15px;line-height:1.4;display:flex;gap:12px;align-items:flex-start;animation:toastIn .4s;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.ev-navhint select {background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:5px;max-width:180px;padding:3px}
.ev-match {color:var(--cyan);font-size:12px;min-width:55px}
.ev-tree .node {touch-action:manipulation}
@media(max-width:860px){
 #cpanel{top:auto;right:0;bottom:0;zoom:.93;max-height:70vh}
 #bottombar{width:calc((100% - 16px) / .93)}
 .ev-top{display:grid;grid-template-columns:1fr auto auto;padding:8px;gap:8px}
 .ev-top>.ep{justify-self:start;grid-column:1;grid-row:1}
 .ev-top>#ev-name{grid-column:2;grid-row:1}
 .ev-top>#ev-x{grid-column:3;grid-row:1}
 .ev-tabs{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
 .ev-tabs .ev-tab{padding:8px 4px;font-size:10px;letter-spacing:.015em;gap:4px;justify-content:center;min-width:0}
 .ev-tools input[type=search]{width:140px}
 .ev-navhint{font-size:11px;gap:6px;padding:5px 8px}
 .ev-tools{padding:6px 8px;gap:7px}
 .ev-tools>span[style]{display:none}
 .ev-tools .navbtn{padding:6px 7px}
 .ev-detail{padding:10px 12px;gap:8px}
 .ev-detail .dd{min-width:0}
 .ev-detail h3{font-size:16px}
 .ev-detail p{font-size:13px}
}

/* ===== CURE MODE (additive) ===== */
.cure-only{display:none!important}
body.cure-mode .cure-only{display:block!important}
body.cure-mode .cchip.cure-only{display:flex!important}
body.cure-mode #h-ep,body.cure-mode #m-cure,body.cure-mode #m-aw{display:none!important}
.cchip{align-items:center;gap:9px;padding:5px 13px 5px 9px;border-radius:10px;background:linear-gradient(180deg,rgba(62,224,192,.12),rgba(62,224,192,.03));border:1px solid rgba(62,224,192,.4);cursor:pointer;transition:.2s}
.cchip>span{font-size:20px;filter:drop-shadow(0 0 6px rgba(62,224,192,.5))}
.cchip b{font-family:var(--mono);font-size:19px;color:#d7fff7;display:block;min-width:30px;text-align:right}
.cchip small{display:block;font-size:9.5px;letter-spacing:.14em;color:#3ee0c0;margin-top:-2px;text-align:right}
#c-pt{border-color:rgba(255,122,217,.45);background:linear-gradient(180deg,rgba(255,122,217,.12),rgba(255,122,217,.03))}#c-pt small{color:#ff7ad9}
#c-fund{border-color:rgba(255,196,71,.45);background:linear-gradient(180deg,rgba(255,196,71,.12),rgba(255,196,71,.03))}#c-fund small{color:#ffc447}
#c-rp{border-color:rgba(90,160,255,.45);background:linear-gradient(180deg,rgba(90,160,255,.12),rgba(90,160,255,.03))}#c-rp small{color:#5aa0ff}
.cchip.pulse{animation:epPulse .5s ease}
.cchip.cnote{cursor:default}
#cw .mb i{box-shadow:0 0 10px rgba(62,224,192,.35)}
#cm-pipe .mb i{background:linear-gradient(90deg,#2f89ff,#3ee0c0)}
#cm-threat .mb i{background:linear-gradient(90deg,#3ee0c0,#ffb02e,#ff4b3b)}
#cm-trust .mb i{background:linear-gradient(90deg,#b07cff,#ff7ad9)}
#cm-cov .mb i{background:linear-gradient(90deg,#3ee0c0,#a8ffee)}
.bub.samples{--bc:#5aa0ff}.bub.donate{--bc:#ffc447}.bub.goodwill{--bc:#ff7ad9}
.pcard.cure .spec{color:var(--pc)}
.evcur{display:flex;gap:8px;flex-wrap:wrap}
.evcur .cchip{display:flex;cursor:default}
.fx.warn{color:#ffb02e;border-color:rgba(255,176,46,.5)}
.cs-file{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:4px}
.cs-file span:nth-child(odd){color:var(--dim)}
.cs-file .unk{color:#5b6c86;font-style:italic}
.cs-pipe{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.cs-pipe div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.cs-pipe div.on{color:#fff}.cs-pipe div.done{color:#3ee0c0}
.cs-pipe i{flex:none;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.cs-pipe .on i{background:#fff;box-shadow:0 0 8px #fff}.cs-pipe .done i{background:#3ee0c0}
</style>
</head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <div id="fx-vignette"></div><div id="fx-scan"></div><div id="fx-red"></div>
  <div id="bubbles"></div>
  <div id="hovertip" class="hidden"></div>

  <div id="hud" class="hidden">
    <header id="topbar">
      <div class="tb-left">
        <div class="chip"><span class="pdot" id="h-pdot"></span><div class="pname"><b id="h-pname">Pathogen</b><small id="h-ptype">Virus</small></div></div>
        <div class="chip datebox"><span id="h-date">Mar 1</span><small>DAY <b id="h-day">0</b></small></div>
        <div class="speed" id="speed">
          <button data-sp="0" title="Pause (Space)">❚❚</button>
          <button data-sp="1" title="Normal (1)">▶</button>
          <button data-sp="2" title="Fast (2)">▶▶</button>
          <button data-sp="3" title="Faster (3)">▶▶▶</button>
        </div>
      </div>
      <div class="tb-right">
        <div class="ep" id="h-ep" title="Evolution points — open the evolution tree (E)"><span id="ep-ico"></span><div><b id="h-epn">0</b><small>EVOLUTION PTS</small></div></div>
        <div class="cchip cure-only" id="c-rp" title="Research Points"><span>🔬</span><div><b>0</b><small>RESEARCH</small></div></div><div class="cchip cure-only" id="c-pt" title="Public Trust"><span>🤝</span><div><b>0</b><small>PUBLIC TRUST</small></div></div><div class="cchip cure-only" id="c-fund" title="Funding"><span>💰</span><div><b>0</b><small>FUNDING</small></div></div><button class="iconbtn" id="b-stats" title="World statistics (S)">📊</button>
        <button class="iconbtn" id="b-news" title="News log (N)">📰<span class="dot hidden" id="news-dot"></span></button>
        <button class="iconbtn" id="b-menu" title="Menu (Esc)">☰</button>
      </div>
    </header>

    <aside id="world" class="glass">
      <div class="w-title"><span>WORLD STATUS</span></div>
      <div class="w-nums">
        <div class="w-num h"><small>Healthy</small><b id="w-h">0</b></div>
        <div class="w-num i"><small>Infected</small><b id="w-i">0</b></div>
        <div class="w-num d"><small>Dead</small><b id="w-d">0</b></div>
      </div>
      <div class="w-bar"><i class="bh" id="wb-h"></i><i class="bc" id="wb-c"></i><i class="bi" id="wb-i"></i><i class="bd" id="wb-d"></i></div>
      <div class="w-info"><span>Countries infected <b id="w-cc">0</b>/<b id="w-ct">177</b></span><span>Collapsed <b id="w-an">0</b></span></div>
      <div class="meter" id="m-cure"><div class="mh"><span>Global research</span><b id="m-cure-v">—</b></div><div class="mb"><i style="width:0%"></i></div></div>
      <div class="meter" id="m-aw"><div class="mh"><span>World awareness</span><b id="m-aw-v">0%</b></div><div class="mb"><i style="width:0%"></i></div></div>
      <div class="cure-only" id="cw"><div class="meter" id="cm-pipe"><div class="mh"><span id="cm-pipe-l">Sample Collection</span><b id="cm-pipe-v">0%</b></div><div class="mb"><i style="width:0%"></i></div></div><div class="meter" id="cm-threat"><div class="mh"><span>Threat level</span><b id="cm-threat-v">UNKNOWN</b></div><div class="mb"><i style="width:0%"></i></div></div><div class="meter" id="cm-trust"><div class="mh"><span>Global trust</span><b id="cm-trust-v">0%</b></div><div class="mb"><i style="width:0%"></i></div></div><div class="meter" id="cm-cov"><div class="mh"><span>Protected</span><b id="cm-cov-v">0%</b></div><div class="mb"><i style="width:0%"></i></div></div></div><div class="w-actions"><button class="btn small" id="b-clist">🌐 Countries</button><button class="btn small" id="b-stat2">📊 Stats</button></div>
    </aside>

    <aside id="cpanel" class="glass hidden"></aside>

    <footer id="bottombar">
      <button class="evolve" id="b-evolve"><span id="evo-ico"></span><span class="lbl">EVOLVE</span><i class="badge hidden" id="evo-badge">0</i></button>
      <div id="ticker" class="glass"><span class="tk-tag" id="tk-tag">NEWS</span><div class="tk-text" id="tk-text">Awaiting first reports…</div></div>
      <div class="bb-right">
        <button class="iconbtn" id="b-zin" title="Zoom in">＋</button>
        <button class="iconbtn" id="b-zout" title="Zoom out">－</button>
        <button class="iconbtn" id="b-fit" title="Reset view (C)">⌖</button>
        <button class="iconbtn" id="b-mute" title="Mute (M)">🔊</button>
      </div>
    </footer>
  </div>

  <div id="floaters"></div>
  <div id="toasts"></div>
  <div id="caption" class="hidden"></div>
  <div id="tip" class="hidden"></div>
  <div id="screens"></div>
  <div id="modal" class="hidden"></div>
  <div id="fx-glitch"></div>
  <div id="loader"><div class="lg">ZERO HOUR</div><div class="lb"><i></i></div></div>
</div>

/* ---------------- NAME MAKER ---------------- */
const NameMaker = (() => {
  const pk = a => a[(Math.random() * a.length) | 0], cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  const adj = ['Crimson','Pale','Hollow','Black','Red','Silent','Ashen','Grey','Scarlet','Bitter','Hungry','Iron','Velvet','Fading','Feral','Burning','Sunken','Whispering','Violet','Cold','Rotting','Midnight','Static','Glass','Ghost'];
  const noun = ['Fever','Rider','Cough','Tide','Dawn','Wake','Lung','Bloom','Choir','Sleep','Rain','Hunger','Mercy','Harvest','Crown','Veil','Tongue','Thirst','Plague','Whisper','Grave','Pulse','Shiver','Ash'];
  const gen = ['Pestis','Morbus','Vira','Necro','Cryo','Hemo','Pyro','Neuro','Toxo','Myco','Pneumo','Sero','Lyssa','Thana','Cardio'];
  const sp = ['rubra','umbrae','mortis','tenebris','fulgens','silens','vorax','noctis','letalis','gelida','cinerea','nigra','acuta','fera'];
  const greek = ['Alpha','Beta','Gamma','Delta','Omega','Sigma','Kappa','Zeta','Theta'];
  const code = ['Lazarus','Pandora','Cerberus','Hydra','Nemesis','Orpheus','Icarus','Medusa','Chimera','Eclipse','Vesper','Requiem','Tartarus','Basilisk'];
  const place = ['Hollow','Reach','Harbor','Ridge','Basin','Fields','Gate','Row'];
  const styles = {
    classic: {label:'Classic', f: () => pk(adj) + ' ' + pk(noun)},
    medical: {label:'Medical', f: () => { const r = Math.random(); return r < .55 ? pk(gen) + 'bacter ' + pk(sp) : r < .8 ? cap(pk(gen).toLowerCase()) + 'virus ' + pk(greek) : pk(gen) + ' ' + pk(sp); }},
    code:    {label:'Codename', f: () => { const r = Math.random(); return r < .4 ? 'Project ' + pk(code) : r < .75 ? 'Strain ' + pk(['X','Z','K','V','M']) + '-' + (((Math.random() * 90) | 0) + 10) : pk(code) + ' ' + pk(greek); }},
    sinister:{label:'Sinister', f: () => { const r = Math.random(); return r < .5 ? 'The ' + pk(adj) + ' ' + pk(noun) : r < .8 ? pk(noun) + ' of ' + pk(['Dawn','Ash','Dusk','Glass','Winter','Salt']) : pk(adj) + ' ' + pk(place); }},
    cure:    {label:'Operation', f: () => 'Operation ' + pk(['Daybreak','Lifeline','Sunrise','Aegis','Beacon','Harbor','Bulwark','Clearwater','Firebreak','Safeguard','Dawn Watch','Open Hand','Lantern','Meridian'])}
  };
  const make = (style) => { const st = styles[style] || styles.classic; for (let i = 0; i < 12; i++) { const n = st.f(); if (n.length <= 22) return n; } return pk(adj) + ' ' + pk(noun).slice(0, 8); };
  const many = (style, n) => { const out = new Set(); let g = 0; while (out.size < n && g++ < 60) out.add(make(style)); return [...out]; };
  return { styles, make, many };
})();

  /* ---------------- bookkeeping ---------------- */

  /* ---------------- news ---------------- */
  G.news = function (text, kind, level) {

  }
  const coolOK = (key, days) => { if ((G.newsCool[key] == null ? -99 : G.newsCool[key]) + days <= G.day) { G.newsCool[key] = G.day; return true; } return false; };

  function drawNews(key, pool) {

  };

  /* ---------------- EP ---------------- */

  G.step = function () {

    const mutPre = G.P.mutations.length;

          if (c.wealth >= 4 && (m = b.rich)) { ib += m.i || 0; lb += m.l || 0; }
          if (c.wealth <= 2 && (m = b.poor)) { ib += m.i || 0; lb += m.l || 0; }
          if (city && (m = b.dense)) { ib += m.i || 0; lb += m.l || 0; }

    /* ---- 2. spread between countries ---- */

        G.emit('firstDeath', { c });
        if (G.tot.dead < 40) G.emit('statement', { cat: 'early', c });
      }
    }

    for (const c of cs) {

        if (!G.worldFlags.firstAnarchy) { G.worldFlags.firstAnarchy = 1; G.emit('event', { id: 'anarchy', title: 'Government Collapse in ' + c.disp, icon: 'flame', major: true, c, text: 'Order has broken down in ' + c.disp + '. With no functioning state, nobody is coordinating the response.' }); }
        G.gainEP(5, 'collapse', c);
      }
    }

    /* ---- 5. research ---- */
    const R = G.research;
    if (R.active && !R.done) {
      let rc = 0;
      for (const c of cs) {
        if (c.anarchy || c.alive < 1) continue;
        const act = (.5 + .5 * Math.min(1, c.aw / 35)) * (c.infected > .5 || c.firstDay >= 0 ? 1 : .5);
        rc += rcBase(c) * (c.alive / c.pop0) * act * (c.econ ? .55 : 1);
      }
      const rn = rc / G.researchMax;
      const deathMobilisation = clamp(Math.log10(1 + G.tot.dead / 1000) / 3, 0, 1);
      const threat = .3 + 1.4 * clamp(.35 * (P.l / 60) + .2 * (P.s / 50) + .2 * (P.i / 60) + .25 * Math.log10(1 + G.tot.dead / 1000) / 4, 0, 1);
      const gate = clamp(G.gaw / 28, .7, 1.4) * (.8 + .2 * deathMobilisation);
      const slow = 1 / (1 + .012 * P.drug + .011 * P.gen + P.rs);
      const gain = .40 * 1.075 * 2.5 * threat * Math.pow(rn, .7) * gate * df.cure * slow * .9; // cure research 10% slower
      R.p = Math.min(100, R.p + gain);
      [25, 50, 75, 90].forEach(m => { if (R.p >= m && !R.announced[m]) { R.announced[m] = 1; newsFrom('research_' + m, null); if (m >= 50) G.emit('statement', { cat: 'research', c: G.start }); G.emit('research', { m }); } });
      if (R.p >= 100) {
        R.done = true; R.doneDay = day;
        G.news('A treatment for ' + G.P.name + ' has been developed. Mass distribution begins!', 'alert', 3);
        G.emit('event', { id: 'cure', title: 'Treatment Developed', icon: 'flask', major: true, text: 'Scientists have developed a treatment for ' + G.P.name + '. Distribution begins within days. Infection will start to collapse wherever it arrives.' });
        for (const c of cs) {
          const base = (6 - (c.wealth + c.health) / 2) * 14 * (.6 + rnd() * .8) * (c.gov === 'A' ? .75 : 1) + 4;
          c.cureAt = c.anarchy ? day + 400 : day + Math.round(clamp(base, 4, 180));
        }
      }
    }
    if (R.done) {
      for (const c of cs) if (!c.cured && c.cureAt >= 0 && day >= c.cureAt) { c.cured = true; G.emit('cureDeployed', { c }); }
    }

    /* ---- 6. mutations, bubbles, events, EP trickle ---- */
    const ty = typeOf(G.P.typeId);
    if (!ty.noMutation && G.tot.infected > 1 && rnd() < .004 + .02 * P.mut) G.doMutation(false);
    G.epFrac += .08 * .95 * (1 + P.ep) * df.ep; while (G.epFrac >= 1) { G.epFrac -= 1; G.P.ep += 1; G.P.epTotal += 1; }
    G.spawnBubble();
    G.bubbles = G.bubbles.filter(b => day - b.born < 24);
    if (!G.worldFlags.pandemic && G.tot.infCountries >= 18 && G.tot.dead >= 100000) {
      G.worldFlags.pandemic = 1; G.news('WHO declares ' + G.P.name + ' a global pandemic after the international death toll passes 100,000.', 'alert', 2);
      G.emit('event', {id:'pandemic', title:'Pandemic Declared', icon:'globe', major:true, text:'Sustained international spread and at least 100,000 deaths prompt a coordinated global response.'});
    }
    G.rollEvents(); G.rollCountryResponses();
    G.recount();
    // infection milestones

    while (G.infMilestone < 9 && ip >= (G.infMilestone + 1) * .1) { G.infMilestone++; G.gainEP(6, 'milestone'); G.news((G.infMilestone * 10) + '% of humanity is now infected with ' + G.P.name + '.', 'alert', 2); }
    while (G.milestoneIdx < MILESTONES.length && G.tot.dead >= MILESTONES[G.milestoneIdx]) {

    }

    if (G.research.active && coolOK('setb', 9999) && false) {}

    /* ---- 7. history + end check ---- */
    if (day % 2 === 0) G.timeline.push({ d: day, h: G.tot.healthy, i: G.tot.infected, x: G.tot.dead, r: R.p, a: G.gaw });
    G.checkEnd();
    G.emit('day', day);
  };

  /* ---------------- mutations ---------------- */
  G.doMutation = function (free) {

    if (!pool.length) return;
    if (!free && ty.id === 'virus' && rnd() < .3) { const bad = pool.filter(m => m.bad); if (bad.length) pool = bad; }
    else if (rnd() < .82 || free) pool = pool.filter(m => !m.bad);
    const m = pick(pool);
    G.P.mutations.push({ n: m.n, d: m.d, fx: m.fx, day: G.day });
    G.stats.mutations++;
    G.computeStats();
    if ((m.fx.rs || m.fx.gen) && G.research.active && !G.research.done) G.research.p = Math.max(0, G.research.p - (m.fx.rs ? 1.2 : .7));

    if (c.hospBroken) t *= .8;

  G.threatLevel = function () { const P = G.P.s; return .3 + 1.4 * clamp(.35 * (P.l / 60) + .2 * (P.s / 50) + .2 * (P.i / 60) + .25 * Math.log10(1 + G.tot.dead / 1000) / 4, 0, 1); };
  G.spawnBubble = function () {

    let r = rnd() * wsum.reduce((a, b) => a + b, 0), i = 0; while (i < list.length - 1 && r > wsum[i]) { r -= wsum[i]; i++; }

    else if (rr > .8 && G.tot.infected >= 2000 && G.countries.some(x => x.firstDay < 0 && x.alive > 0)) type = 'spread';
    else if (rr > .72 && G.gaw > 25) type = 'calm';
    const city = rnd() < .75 ? pick(c.cities) : null;
    G.bubbles.push({ id: G.bubbleId++, ci: c.idx, city: city ? city.k : -1, type, born: G.day, ox: (rnd() - .5) * 14, oy: (rnd() - .5) * 8 });
    G.emit('bubble');
  };
  G.collectBubble = function (id) {
    const k = G.bubbles.findIndex(b => b.id === id); if (k < 0) return null;
    const b = G.bubbles[k]; G.bubbles.splice(k, 1); G.stats.bubbles++;
    const c = G.countries[b.ci]; let res = { type: b.type, c };
    if (b.type === 'dna') { res.v = G.gainEP(1.5 + (c.pop0 > 5e7 ? 1.5 : 0) + rnd() * 1.5, 'bubble', c) * (1 + (typeOf(G.P.typeId).id === 'nano' ? 0 : 0)); }
    else if (b.type === 'disrupt') { G.research.p = Math.max(0, G.research.p - (.6 + rnd() * .5)); res.v = 'research'; G.gainEP(1, 'bubble', c); }
    else if (b.type === 'spread') {
      const cand = G.countries.filter(x => x.firstDay < 0 && x.alive > 0 && x.air > 0);
      const t = cand.length ? pick(cand) : G.countries.find(x => x.firstDay < 0 && x.alive > 0);
      if (t) { infectCountry(t, 'air', c); G.emit('flight', { a: c.idx, b: t.idx, hit: true, kind: 'air' }); res.v = t.disp; } G.gainEP(1, 'bubble', c);

    else if (b.type === 'calm') { c.aw = Math.max(0, c.aw - 8); G.gaw = Math.max(0, G.gaw - 2); res.v = 'awareness'; G.gainEP(1, 'bubble', c); }

    return res;

  const cureShown = { rp: -1, pt: -1, fund: -1 };
  function cureChips() {
    const C = G.cure; if (!C) return;
    const pairs = [['rp', 'c-rp', Math.floor(C.rp)], ['pt', 'c-pt', Math.floor(C.pt)], ['fund', 'c-fund', Math.floor(C.fund)]];

    }
    $('c-pt').title = 'Public Trust (also global trust): ' + C.pt.toFixed(1) + ' / ' + (100 + C.s.ptCap);
    if (!U._badgeT || performance.now() - U._badgeT > 700) { U._badgeT = performance.now(); updateBadge(); }
  }
  function updateCureHUD() {

    $('h-date').textContent = dt.text; $('h-day').textContent = G.day;

    $('wb-i').style.width = C.revealed ? Math.max(rep.inf / tot * 100, rep.inf > 0 ? .6 : 0) + '%' : '0%'; $('wb-d').style.width = C.revealed ? rep.dead / tot * 100 + '%' : '0%';
    $('w-cc').textContent = C.revealed ? rep.cc : '?'; $('w-an').textContent = t.anarchy;
    const st = C.pipe.stage;
    $('cm-pipe-l').textContent = G.CURE_STAGES[st];
    $('cm-pipe-v').textContent = st >= 8 ? Math.round(cov * 100) + '% / 85%' : Math.round(C.pipePct) + '%';
    $('cm-pipe').querySelector('i').style.width = (st >= 8 ? clamp(cov / .85 * 100, 0, 100) : C.pipePct) + '%';
    $('cm-threat-v').textContent = C.threat < 0 ? 'UNKNOWN' : G.THREAT_NAMES[C.threat];
    $('cm-threat').querySelector('i').style.width = (C.threat < 0 ? 0 : (C.threat + 1) / 5 * 100) + '%';
    $('cm-trust-v').textContent = Math.round(C.trustMean) + '%'; $('cm-trust').querySelector('i').style.width = C.trustMean + '%';
    $('cm-cov-v').textContent = Math.round(t.cured / Math.max(1, t.alive) * 100) + '%'; $('cm-cov').querySelector('i').style.width = t.cured / Math.max(1, t.alive) * 100 + '%';

  function drawChart(cv, tl, opt = {}) {
    const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth || 600, H = cv.clientHeight || 240;
    cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const L = 44, R = 12, T = 12, B = 26, w = W - L - R, h = H - T - B;
    g.font = '11px Rajdhani, sans-serif'; g.fillStyle = '#8a9db8'; g.strokeStyle = 'rgba(130,170,230,.12)'; g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = T + h - i / 4 * h; g.beginPath(); g.moveTo(L, y); g.lineTo(L + w, y); g.stroke(); g.textAlign = 'right'; g.fillText(i * 25 + '%', L - 6, y + 4); }
    if (!tl || tl.length < 2) { g.fillStyle = '#5b6c86'; g.textAlign = 'center'; g.fillText('Not enough data yet — let the outbreak run.', W / 2, H / 2); return; }
    const d0 = tl[0].d, d1 = tl[tl.length - 1].d, tot = G.totalPop0;
    const X = d => L + (d - d0) / Math.max(1, d1 - d0) * w, Y = v => T + h - clamp(v, 0, 100) / 100 * h;
    g.textAlign = 'center'; for (let i = 0; i <= 5; i++) { const d = Math.round(d0 + (d1 - d0) * i / 5); g.fillText('Day ' + d, X(d), H - 8); }
    const series = [['x', 'Dead', '#b07cff', v => v / tot * 100], ['i', 'Infected', '#ff4b3b', v => v / tot * 100], ['r', 'Research', '#35d6c4', v => v], ['a', 'Awareness', '#ffb02e', v => v]];
    series.forEach(([k, n, col, f]) => {
      g.beginPath(); tl.forEach((p, i) => { const x = X(p.d), y = Y(f(p[k])); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.lineWidth = 2.2; g.strokeStyle = col; g.lineJoin = 'round'; g.stroke();
      if (k === 'i' || k === 'x') { g.lineTo(X(d1), Y(0)); g.lineTo(X(d0), Y(0)); g.closePath(); const gr = g.createLinearGradient(0, T, 0, T + h); gr.addColorStop(0, col + '55'); gr.addColorStop(1, col + '00'); g.fillStyle = gr; g.fill(); }
    });
  }

      ${slider('master', 'Master volume')}${slider('music', 'Music')}${slider('sfx', 'Sound effects')}${slider('speech', 'Broadcasts & speeches')}
      <div class="setrow"><label>Music source<small>Generated score reacts to the outbreak. Archive streams public-domain orchestral recordings from Wikimedia Commons.</small></label><div class="seg" id="se-mm"><button data-m="gen" class="${c.musicMode === 'gen' ? 'on' : ''}">Generated</button><button data-m="archive" class="${c.musicMode === 'archive' ? 'on' : ''}">Archive</button><button data-m="off" class="${c.musicMode === 'off' ? 'on' : ''}">Off</button></div></div>
      ${tog('speechOn', 'Emergency statements', 'Spoken government announcements (browser voice).')}${tog('archiveOn', 'Archive speeches', 'Real historical government broadcasts from Wikimedia Commons, played at key moments.')}${tog('photos', 'Live city photos', 'Fetch real photographs from Wikipedia / Wikimedia Commons.')}${tog('labels', 'Map labels')}${tog('reduceMotion', 'Reduce motion')}${tog('tips', 'Show tips')}
      <div class="setrow"><label>Archive loudness<small>How hard historical speeches are boosted. Turn it down if they blast.</small></label><input type="range" min="1" max="5" step=".1" value="${c.archVol}" data-k="archVol"></div>
      <div class="setrow"><label>Archive frequency<small>How often real historical speeches interrupt the score.</small></label><div class="seg" data-sk="archFreq"><button data-v="rare" class="${c.archFreq === 'rare' ? 'on' : ''}">Rare</button><button data-v="normal" class="${c.archFreq === 'normal' ? 'on' : ''}">Normal</button><button data-v="often" class="${c.archFreq === 'often' ? 'on' : ''}">Often</button></div></div>
      ${tog('captions', 'Broadcast captions', 'Show the caption bar for speeches and archive clips.')}${tog('glitch', 'Mutation glitch flash', 'Screen flash when your pathogen mutates.')}${tog('autosave', 'Autosave', 'Save automatically every 10 days.')}
      <div class="setrow"><label>Starting game speed</label><div class="seg" data-sk="defSpeed"><button data-v="1" class="${c.defSpeed === 1 ? 'on' : ''}">1x</button><button data-v="2" class="${c.defSpeed === 2 ? 'on' : ''}">2x</button><button data-v="3" class="${c.defSpeed === 3 ? 'on' : ''}">3x</button></div></div>
      <div class="setrow"><label>Test audio</label><button class="btn small" id="se-test">▶ Play test</button></div>
      <div class="setrow"><label>Reset tutorial tips</label><button class="btn small" id="se-tips">Reset</button></div></div></div>`, 'dim');
    s.addEventListener('pointerdown', e => { if (e.target === s) $('se-x').click(); });
    $('se-x').onclick = () => { U.closeScreen('scr-settings'); if (fromMenu) U.openMenu(); };
    s.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => U.setCfg(r.dataset.k, +r.value));
    s.querySelectorAll('.tog').forEach(t => t.onclick = () => { t.classList.toggle('on'); U.setCfg(t.dataset.k, t.classList.contains('on')); });
    s.querySelectorAll('#se-mm button').forEach(b => b.onclick = () => { s.querySelectorAll('#se-mm button').forEach(x => x.classList.toggle('on', x === b)); AudioSys.init(); U.setCfg('musicMode', b.dataset.m); AudioSys.setMusicMode(b.dataset.m); });
    s.querySelectorAll('.seg[data-sk]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { sg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); const v = b.dataset.v; U.setCfg(sg.dataset.sk, /^\d+$/.test(v) ? +v : v); }));
    $('se-test').onclick = () => { AudioSys.init(); AudioSys.sfx('alert'); setTimeout(() => AudioSys.sfx('bubble'), 700); AudioSys.speak('This is a test of the emergency broadcast system. This is only a test.', { gap: 0 }); };
    $('se-tips').onclick = () => { U.tips = {}; try { localStorage.removeItem('zerohour.tips.v1'); } catch (e) { } U.toast({ icon: '✓', title: 'Tips reset', cls: 'cyan', ms: 1800 }); };
  };
  U.openCredits = function (fromMenu) {
    const arch = AudioSys.Archive;
    const used = [...arch.speeches.map(s => `Speech — ${esc(s.title)} (${esc(s.credit)})`), ...arch.music.map(s => `Music — ${esc(s.title)} (${esc(s.credit)})`)];
    const s = U.showScreen('scr-credits', `<div class="panel-wrap narrow"><div class="scr-head"><h2>Credits & sources</h2><button class="xbtn" id="cr-x">✕</button></div><div class="panel-body credits">
      <p><b>ZERO HOUR</b> is an original strategy simulation inspired by the "infect the world" genre. All code, names, art direction, and the generative score are original.</p>
      <ul>${SITE_CREDITS.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${used.length ? `<p style="margin-top:14px"><b>Archive recordings resolved this session</b></p><ul>${used.map(u => `<li>${u}</li>`).join('')}</ul>` : '<p style="color:var(--dim)">Archive recordings are resolved from Wikimedia Commons when audio starts.</p>'}
      <p style="color:var(--faint);font-size:12.5px;margin-top:14px">Everything here is a work of fiction. Any resemblance to real outbreaks is unintended.</p></div></div>`, 'dim');
    s.addEventListener('pointerdown', e => { if (e.target === s) $('cr-x').click(); });
    $('cr-x').onclick = () => { U.closeScreen('scr-credits'); if (fromMenu) U.openMenu(); };
  };

  /* ---------- end screen ---------- */
  const ENDINGS = {
    extinction: { win: true, kick: 'Total extinction', title: 'No one is left', lead: 'The last human has fallen. The cities are silent, the lights are out, and your pathogen has nothing left to infect. A perfect, terrible victory.' },
    collapse: { win: true, kick: 'Civilisation collapsed', title: 'The world has ended', lead: 'Governments have fallen, borders are meaningless, and the survivors are scattered and leaderless. Humanity will never recover from this.' },
    silent: { win: true, kick: 'The silent takeover', title: 'Everyone carries it', lead: 'Almost every person on Earth is infected — and almost no one noticed. Your pathogen has quietly become part of humanity.' },
    cured: { win: false, kick: 'Treatment deployed', title: 'Humanity wins', lead: 'Scientists beat the clock. A treatment was mass-produced and distributed, and your pathogen has been driven out.' },
    eradicated: { win: false, kick: 'Pathogen eradicated', title: 'Burned out', lead: 'Your pathogen ran out of hosts. Without anyone left to infect, it simply faded away.' }
  };
  const RANKS = [[0, 'Common cold'], [4000, 'Seasonal nuisance'], [12000, 'Outbreak'], [26000, 'Epidemic'], [45000, 'Pandemic'], [70000, 'Plague lord'], [100000, 'Extinction event']];
  U.showEnd = function (over) {
    if (over && String(over.kind).indexOf('c_') === 0) return showCureEnd(over);
    const E_ = ENDINGS[over.kind] || ENDINGS.eradicated, t = G.tot, P = G.P, ty = G.typeOf(P.typeId), st = G.stats;
    const dm = { casual: .7, normal: 1, brutal: 1.3, mega: 1.7, nightmare: 2.2 }[G.diff.id] || 1;
    let score = (t.deadPct * 60000 + st.maxInfectedPct * 9000 + t.infCountries * 25 + (E_.win ? 16000 : 0) + (E_.win ? Math.max(0, 650 - G.day) * 30 : 0) + st.bubbles * 6 + P.combos.length * 400 + (over.kind === 'extinction' ? 12000 : 0)) * dm;
    score = Math.round(score);
    let rank = RANKS[0][1]; RANKS.forEach(r => { if (score >= r[0]) rank = r[1]; });
    U.addBest({ score, name: P.name, type: ty.name, diff: G.diff.name, day: G.day, kind: over.kind });
    try { localStorage.removeItem('zerohour.save.v1'); } catch (e) { }
    const best = U.best();
    const shareTxt = `ZERO HOUR — ${P.name} (${ty.name}, ${G.diff.name}): ${E_.title}. Day ${G.day}, ${G.fmt(t.dead)} dead (${(t.deadPct * 100).toFixed(1)}% of humanity), ${t.infCountries} countries. Score ${score.toLocaleString('en-US')} — ${rank}.`;
    AudioSys.sfx(E_.win ? 'win' : 'lose'); AudioSys.setIntensity(E_.win ? .95 : .1);
    const s = U.showScreen('scr-end', `<div class="end-card ${E_.win ? 'win' : 'lose'}">
      <div class="kick">${E_.kick}</div><h1>${E_.title}</h1><p class="lead">${E_.lead}</p>
      <div class="rankline"><div class="score">${score.toLocaleString('en-US')}<small>SCORE</small></div><div class="score" style="font-size:22px">${rank}<small>RANK</small></div>${best.length > 1 && best[0].score === score ? '<span class="tag" style="color:var(--amber);border-color:var(--amber)">New best!</span>' : ''}</div>
      <div class="kpis">
        <div class="kpi"><small>Days survived</small><b>${G.day}</b></div><div class="kpi"><small>Total dead</small><b>${G.fmt(t.dead)}</b></div><div class="kpi"><small>Peak infected</small><b>${(st.maxInfectedPct * 100).toFixed(0)}%</b></div><div class="kpi"><small>Countries</small><b>${t.infCountries}/${G.countries.length}</b></div>
        <div class="kpi"><small>Collapsed</small><b>${st.countriesLost}</b></div><div class="kpi"><small>Traits</small><b>${P.traits.size}</b></div><div class="kpi"><small>Mutations</small><b>${st.mutations}</b></div><div class="kpi"><small>Research</small><b>${G.research.p.toFixed(0)}%</b></div></div>
      <div class="chartbox"><canvas id="end-chart" style="height:200px"></canvas>${LEG}</div>
      <div class="foot"><button class="btn primary" id="en-again">↻ Same pathogen, new start</button><button class="btn" id="en-new">New outbreak</button><button class="btn" id="en-copy">📋 Copy result</button><button class="btn ghost" id="en-menu">Main menu</button></div></div>`, 'dim');
    s.style.alignItems = 'center'; s.style.justifyContent = 'center'; s.style.overflow = 'auto'; s.style.background = 'rgba(2,4,9,.86)';
    requestAnimationFrame(() => drawChart($('end-chart'), G.timeline));
    $('en-again').onclick = () => U.restartSame();
    $('en-new').onclick = () => { U.closeScreen('scr-end', true); $('hud').classList.add('hidden'); U.state = 'title'; U.showTitle(); setTimeout(() => $('t-new') && $('t-new').click(), 50); };
    $('en-menu').onclick = () => { U.closeScreen('scr-end', true); U.state = 'title'; AudioSys.setIntensity(.12); U.showTitle(); };
    $('en-copy').onclick = () => { try { navigator.clipboard.writeText(shareTxt); U.toast({ icon: '📋', title: 'Copied to clipboard', cls: 'cyan', ms: 2000 }); } catch (e) { U.toast({ icon: '⚠', title: 'Copy failed', text: shareTxt, cls: 'amber' }); } };
  };
  U._drawChart = drawChart;
})(UI);

/* ============================================================
   ZERO HOUR — UI (part 3): game event wiring
   ============================================================ */
(function (U) {
  const G = Game, $ = U.$, esc = U.esc;
  const rnd = Math.random, pick = a => a[(rnd() * a.length) | 0];
  const fillT = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] != null ? o[k] : m));
  const play = () => U.state === 'play';

  function maybeArchive(tag) {
    if (!play() || !U.cfg.archiveOn || AudioSys.muted || ['normal','abandoned'].includes(G.newsStage()) || AudioSys.Archive.active || AudioSys.Archive.pending) return;
    const now = performance.now(); if (now - U.lastArchive < ({ rare: 85000, normal: 48000, often: 30000 }[U.cfg.archFreq] || 48000)) return;
    if (AudioSys.voiceBusy() || AudioSys.voiceQ.length || now - AudioSys.lastVoiceEnd < 9000) return; // emergency speech has priority; leave a breath between voices
    U.lastArchive = now;
    AudioSys.playBroadcast(tag, tr => U.caption('HISTORICAL ARCHIVE', tr.title, tr.credit, () => AudioSys.skipBroadcast()), () => U.hideCaption()).then(ok => { if (!ok) U.lastArchive = now - 20000; });
  }

  function setTicker(n) {
    if (G.newsStage() === 'abandoned' && n.kind !== 'abandoned') return;
    if (G.newsStage() === 'normal' && n.kind !== 'normal') return;
    const tag = { alert: ['ALERT', 'alert'], mutation: ['MUTATION', 'mut'], combo: ['SYNERGY', 'combo'], gov: ['GOV', ''], event: ['EVENT', 'alert'] }[n.kind] || ['NEWS', ''];
    if (U.state === 'play') {
      const tt = $('tk-tag'); tt.textContent = tag[0]; tt.className = 'tk-tag ' + tag[1];
      const old = $('tk-text'), nw = document.createElement('div'); nw.className = 'tk-text'; nw.id = 'tk-text'; nw.textContent = n.text; old.replaceWith(nw);
    } else {
      const t = $('t-ticker'); if (t) t.innerHTML = `<span style="color:var(--red2);font-weight:700;letter-spacing:.14em">LIVE · </span>${esc(n.text)}`;
    }
  }

  U.wireGame = function () {
    G.on('news', n => {
      setTicker(n);
      if (play() && n.level >= 1 && !U.screens.has('scr-news')) { $('news-dot').classList.remove('hidden'); }
    });
    G.on('day', d => {
      if (!play()) return;
      U.updateHUD(); AudioSys.setIntensity(U.intensity());
      if (d % 10 === 0 && U.cfg.autosave !== false) U.save(true);
      if (d % 3 === 0) U.updateBadge();
      // regular real-world speeches while the outbreak is visible
      if (G.detected && G.newsStage() !== 'abandoned' && d % ({ rare: 8, normal: 5, often: 3 }[U.cfg.archFreq] || 5) === 0) {
        const t = G.tot.dead >= 1e6 ? pick(['deaths','collapse','crisis']) : G.research.active ? pick(['research','crisis','lockdown']) : pick(['crisis','border','lockdown']);
        maybeArchive(t);
      }
    });
    G.on('flight', f => { if (!play() && U.state !== 'title' && U.state !== 'pick' && U.state !== 'new') return; MapView.addFlight(f.a, f.b, f.kind, f.hit); if (play() && f.hit && f.kind === 'air') AudioSys.sfx('flight'); });
    G.on('countryInfected', ({ c, from, via }) => {
      if (!play()) return;
      MapView.addRing(c.idx, '255,70,60', 1.2); AudioSys.sfx('newCountry');
      if (G.tot.infCountries === 2) U.tip('spread', 'It spreads!', 'Planes, ships and land borders carry infection abroad. Airborne, water and insect traits all help.');
    });
    G.on('policy', ({ c, kind }) => {
      if (!play()) return;
      if (kind === 'border' || kind === 'air' || kind === 'sea') MapView.addRing(c.idx, '53,214,196', 1.3);
      if (kind === 'lock') { MapView.addRing(c.idx, '90,160,255', 1.4); AudioSys.sfx('siren'); if (c.pop0 > 1.5e7 || Math.random() < .5) maybeArchive('lockdown'); }
      if (kind === 'border' && c.pop0 > 1.5e7) maybeArchive('border');
      if (kind === 'hospital') MapView.addRing(c.idx, '255,176,46', 1);
    });
    G.on('firstDeath', ({ c }) => { if (!play()) return; MapView.addRing(c.idx, '176,124,255', 1.3); AudioSys.sfx('death'); if (G.tot.dead <= 30) U.tip('death', 'First death', 'Isolated deaths attract local attention. Larger death tolls build awareness; global cure research starts at 100,000 deaths.'); });
    G.on('anarchy', ({ c }) => { if (!play()) return; MapView.addRing(c.idx, '176,124,255', 2); AudioSys.sfx('death'); U.toast({ icon: '☠', title: 'Anarchy in ' + c.disp, text: 'The government has collapsed.', cls: 'violet' }); maybeArchive('collapse'); });
    G.on('cureDeployed', ({ c }) => { if (!play()) return; if (c.pop0 > 3e7) MapView.addRing(c.idx, '53,214,196', 1.6); });
    G.on('mutation', m => {
      if (!play()) return; AudioSys.sfx('mutation');
      if (U.cfg.glitch !== false) { const g = $('fx-glitch'); g.classList.remove('on'); void g.offsetWidth; g.classList.add('on'); }
      U.toast({ icon: '☣', title: 'Mutation: ' + m.n, text: m.d, cls: 'violet', ms: 6500 });
    });
    G.on('combo', cb => { if (!play()) return; AudioSys.sfx('cure'); U.toast({ icon: '⚡', title: 'Synergy: ' + cb.name, text: cb.msg, cls: 'cyan', ms: 6500 }); });
    G.on('research', ({ m }) => { if (!play()) return; AudioSys.sfx('ping'); if (m === 25) U.toast({ icon: '🧪', title: 'Research is gaining ground', text: 'Global research reached 25%. Genetic hardness and drug resistance slow it down.', cls: 'cyan' }); if (m >= 50) U.toast({ icon: '🧪', title: 'Research ' + m + '%', text: 'The world is closing in on a treatment.', cls: 'cyan' }); if (m === 50) U.tip('research', 'Slow the cure', 'Evolve genetic hardness, drug resistance and mutation traits, or pop research-disrupting bubbles.'); });
    G.on('milestone', ({ n }) => { if (!play()) return; AudioSys.sfx('death'); U.toast({ icon: '💀', title: G.fmt(n) + ' dead', text: 'The global death toll keeps rising.', cls: 'violet', ms: 4500 }); maybeArchive('deaths'); });
    G.on('detected', () => {
      if (!play()) return; AudioSys.sfx('alert');
      U.toast({icon:'🔬',title:'Pathogen identified',text:G.P.name + ' is under local investigation. Global cure research will not start before 1,000 deaths.',cls:'amber',ms:7000});
    });
    G.on('researchStarted', () => { if (!play()) return; maybeArchive('crisis'); U.modalOpen({icon:'🔬',title:'Global cure programme begins',sfx:'alert',text:'The death toll has passed 1,000. Governments now fund coordinated cure research. Rising deaths and awareness will increase participation.'}); });
    G.on('event', ev => {
      if (!play()) return;
      if (ev.id === 'bombardment' || ev.id === 'martiallaw') maybeArchive('military'); else if (ev.id === 'pandemic' || ev.id === 'who' || (G.tot.dead >= 1000 && Math.random() < .6)) maybeArchive('crisis');
      if (ev.c && ev.id !== 'pandemic') MapView.addRing(ev.c.idx, '255,176,46', 1.1);
      if (ev.major) U.modalOpen({ icon: Art.eventIcon[ev.icon] || '🧬', title: ev.title, text: ev.text, big: false, sfx: ev.id === 'who' || ev.id === 'pandemic' ? 'alert' : 'warn', buttons: ev.c ? [{ label: 'Show on map', fn: () => U.openCountry(ev.c.idx, true) }, { label: 'Continue', cls: 'primary' }] : undefined });
      else U.toast({ icon: Art.eventIcon[ev.icon] || '🧬', title: ev.title, text: ev.text, cls: 'amber', ms: 6000 });
    });
    G.on('statement', ({ cat, c }) => {
      if (!play() || !(G.mode === 'cure' ? (CURE_STATEMENTS[cat] || STATEMENTS[cat]) : STATEMENTS[cat]) || ['normal','abandoned'].includes(G.newsStage())) return;
      const text = fillT(pick(G.mode === 'cure' && CURE_STATEMENTS[cat] ? CURE_STATEMENTS[cat] : STATEMENTS[cat]), { c: c.disp });
      AudioSys.speak(text, { gap: cat === 'lockdown' || cat === 'border' ? 32000 : 50000, onStart: () => U.caption('BROADCAST', text, 'Government of ' + c.disp), onEnd: () => U.hideCaption() });
    });
    G.on('end', over => {
      if (!play()) return; U.state = 'end'; U.paused = true;
      U.toast({ icon: '🏁', title: 'The outbreak has ended', cls: 'red', ms: 3000 });
      setTimeout(() => U.showEnd(over), 1600);
    });
    G.on('newgame', () => { MapView.clearEffects(); AudioSys.skipBroadcast(); if(window.speechSynthesis)speechSynthesis.cancel(); U.hideCaption(); U.lastArchive = -80000; AudioSys.Archive.played.clear(); AudioSys.Archive.lastUrl = null; AudioSys.Archive.failed.clear(); AudioSys.Archive.resolve(); const latest = [...G.newsLog].reverse().find(n => n.kind === G.newsStage() || (G.newsStage() !== 'normal' && G.newsStage() !== 'abandoned' && n.kind !== 'mutation' && n.kind !== 'combo')); if (latest) setTicker(latest); U.bubEls.forEach(e => e.remove()); U.bubEls.clear(); });
    G.on('cureReveal', () => {
      if (!play()) return; AudioSys.sfx('alert'); maybeArchive('crisis');
      U.modalOpen({ icon: '🧪', title: 'Outbreak identified', sfx: 'alert', text: 'Surveillance has found it. You now have a partial case file. Sample, sequence and design a cure, and protect the places it has not reached yet.' });
      U.tip('creveal', CURE_TIPS.reveal[0], CURE_TIPS.reveal[1]); setTimeout(() => U.tip('cpipe', CURE_TIPS.pipe[0], CURE_TIPS.pipe[1]), 9000);
    });
    G.on('cureStage', ({ stage, name }) => {
      if (!play() || stage === 0) return; AudioSys.sfx('ping');
      U.toast({ icon: '🧪', title: 'Pipeline: ' + name, text: stage >= 8 ? 'Distribution begins. Deploy country by country.' : 'Cure pipeline advanced.', cls: 'cyan', ms: 5200 });
      if (stage === 3 || stage === 6) maybeArchive('research');
    });
    G.on('cureFail', ({ stage }) => { if (!play()) return; AudioSys.sfx('warn'); U.toast({ icon: '⚠', title: 'Setback: ' + (G.CURE_STAGES[stage] || 'stage') + ' failed', text: 'The stage has to be redone and public trust takes a hit.', cls: 'red', ms: 6500 }); U.tip('cfail', 'Trials can fail', 'Safety and mutation-resistance traits reduce setbacks; rushing risky traits raises them.'); });
    AudioSys.fallbackNotice = () => U.toast({ icon: '🎵', title: 'Archive music unavailable', text: 'Using the generated score instead.', cls: 'amber', ms: 4000 });
  };
})(UI);

window.addEventListener('DOMContentLoaded', function () {
  try { UI.boot(); }
  catch (e) { console.error(e); var l = document.getElementById('loader'); if (l) l.innerHTML = '<div style="color:#ff6a4d;font:16px sans-serif;padding:24px;text-align:center">Something went wrong while starting.<br><small>' + String(e && e.message || e) + '</small></div>'; }
});
</script>
